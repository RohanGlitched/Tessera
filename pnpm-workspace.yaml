# Which dependencies may run install scripts, for the Anchor and test toolchain at
# the repository root. See web/pnpm-workspace.yaml for the same decision made for
# the app, and the reasoning behind it: these are native accelerators with
# JavaScript fallbacks, and they have never been built here.
allowBuilds:
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
